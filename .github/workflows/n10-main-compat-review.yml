name: N10 isolated main compatibility (no deployment)
on:
  push:
    branches:
      - 'review/n10-main-compat-20261103-r3'
  workflow_dispatch:
  # Pull request CI for this isolated review candidate; never deploy.
  pull_request:
    paths:
      - 'js/mmhvault-n10-a7-83-security-center.js'
      - 'security/n10-main-compat/**'
      - '.github/workflows/n10-main-compat-review.yml'
permissions:
  contents: read
jobs:
  offline-account-security:
    name: N10 Account Security static and synthetic regression
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated review branch
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse account security JavaScript
        run: node --check js/mmhvault-n10-a7-83-security-center.js
      - name: Run synthetic security and MFA regressions
        run: node security/n10-main-compat/test-ui-secret-guards.mjs
      - name: Install Playwright browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run synthetic browser smoke in Chromium and WebKit
        run: node security/n10-main-compat/test-browser-mfa-smoke.mjs
# Does not deploy, access secrets, create users, modify database, or call Vault.
