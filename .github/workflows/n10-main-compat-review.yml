name: N10 isolated main compatibility (no deployment)
on:
  push:
    branches:
      - 'review/n10-main-compat-20261103-r3'
  workflow_dispatch:
  # Pull request CI for this isolated review candidate; never deploy.
  pull_request:
    paths:
      - 'js/mmhvault-n10-a7-83-security-center.js'
      - 'security/n10-main-compat/**'
      - 'security/n10-signup-escrow-review/**'
      - 'security/n10-recovery-view/**'
      - 'security/n10-integration-review/**'
      - 'security/n10-username-escrow-candidate/**'
      - '.github/workflows/n10-main-compat-review.yml'
permissions:
  contents: read
jobs:
  offline-account-security:
    name: N10 Account Security static and synthetic regression
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated review branch
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse account security JavaScript
        run: node --check js/mmhvault-n10-a7-83-security-center.js
      - name: Run synthetic security and MFA regressions
        run: node security/n10-main-compat/test-ui-secret-guards.mjs
      - name: Parse isolated recovery integration modules
        run: |
          node --check security/n10-signup-escrow-review/immutable-signup-escrow.mjs
          node --check security/n10-recovery-view/recovery-transport.mjs
          node --check security/n10-recovery-view/recovery-view-controller.mjs
          node --check security/n10-recovery-view/recovery-view-lifecycle.mjs
          node --check security/n10-integration-review/test-fixed-key-signup-to-reveal.mjs
      - name: Test signup escrow, private viewer, lifecycle, transport and integration
        run: |
          node --test security/n10-signup-escrow-review/test-immutable-signup-escrow.mjs
          node --test security/n10-recovery-view/test-recovery-transport.mjs security/n10-recovery-view/test-recovery-view-controller.mjs security/n10-recovery-view/test-recovery-view-lifecycle.mjs
          node --test security/n10-integration-review/test-fixed-key-signup-to-reveal.mjs
      - name: Verify hard-OFF username Edge candidate and failure paths
        run: |
          node --check --input-type=module < security/n10-username-escrow-candidate/username-edge-REVIEW-ONLY.ts
          node --test security/n10-username-escrow-candidate/test-username-edge-contract.mjs
      - name: Install Playwright browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run synthetic browser smoke in Chromium and WebKit
        run: node security/n10-main-compat/test-browser-mfa-smoke.mjs
# Does not deploy, access secrets, create users, modify database, or call Vault.
