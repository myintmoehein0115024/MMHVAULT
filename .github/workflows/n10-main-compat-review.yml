name: N10 isolated main compatibility (no deployment)
on:
  push:
    branches:
      - 'review/n10-main-compat-20261101'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-account-security:
    name: N10 Account Security static and synthetic regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated review branch
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse account security JavaScript
        run: node --check js/mmhvault-n10-a7-83-security-center.js
      - name: Run synthetic security and MFA regressions
        run: node security/n10-main-compat/test-ui-secret-guards.mjs
# Does not deploy, access secrets, create users, modify database, or call Vault.
