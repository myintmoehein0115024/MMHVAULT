name: Personal Budget isolated visual QA (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths: ['app.html','css/mmhvault-liquid-budget-p910.css','css/mmhvault-forecast-v1.css','js/mmhvault-forecast-v1.js','tests/personal-budget-v2.mjs','tests/personal-planning-nav-v263.mjs','tests/personal-goals-v263.mjs','css/mmhvault-liquid-goals-p911.css','css/mmhvault-liquid-recurring-p912.css','tests/personal-recurring-v264.mjs','tests/personal-settings-currency-v265.mjs','tests/personal-report-export-browser-v265.mjs','tools/personal-font-stage-v265.mjs','tests/personal-settings-font-browser-v265.mjs','tools/personal-font-pack-v265.py','tools/personal-font-bundle-v265.py','tools/personal-font-verify-v265.mjs','css/mmhvault-settings-life-p928.css','.github/workflows/personal-budget-v2.yml']
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tests/personal-budget-v2.mjs && node --check tests/personal-planning-nav-v263.mjs && node --check tests/personal-goals-v263.mjs && node --check js/mmhvault-forecast-v1.js && node --check tests/personal-recurring-v264.mjs
      - run: node tests/personal-settings-currency-v265.mjs
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/personal-budget-v2.mjs
      - run: node tests/personal-planning-nav-v263.mjs

      - run: node tests/personal-goals-v263.mjs
      - run: node tests/personal-recurring-v264.mjs
      - run: node --check tests/personal-report-export-browser-v265.mjs && node tests/personal-report-export-browser-v265.mjs
      - name: Prepare isolated font compression QA
        run: |
          python3 -m venv "$RUNNER_TEMP/mmh-fontqa"
          "$RUNNER_TEMP/mmh-fontqa/bin/python" -m pip install --disable-pip-version-check fonttools==4.59.2 brotli==1.1.0
      - run: node --check tests/personal-settings-font-browser-v265.mjs && node tests/personal-settings-font-browser-v265.mjs
        env:
          MMH_FONTQA_PYTHON: ${{ runner.temp }}/mmh-fontqa/bin/python
