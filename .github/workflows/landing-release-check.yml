name: MMHVAULT Landing release gate
on:
  push:
    branches:
      - 'release/landing-seo-pwa-*'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'robots.txt'
      - 'mmh-manifest-v2.webmanifest'
      - 'landing-assets/**'
      - 'register/**'
      - 'features/**'
      - 'about/**'
      - 'business/**'
      - 'privacy.html'
      - 'terms.html'
      - 'security.html'
      - 'sitemap.xml'
      - '.github/workflows/landing-release-check.yml'
permissions:
  contents: read
jobs:
  preflight:
    name: Static SEO/Auth/PWA preservation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check landing-assets/landing.js
      - name: Public information language script syntax
        run: node --check landing-assets/public-pages.js
      - name: Release invariants
        run: node landing-assets/landing-release-check.cjs

  browser-qa:
    name: Public responsive browser QA (no auth)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
      - name: Run six-size Landing and public-page browser regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mmhvault-landing-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 2
          node landing-assets/landing-browser-check.cjs
      - name: Upload public-only visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmhvault-landing-public-visual-qa
          path: |
            landing-qa-screenshots/*.png
            landing-qa-screenshots/performance-l143.json
          if-no-files-found: ignore
          retention-days: 7

  webkit-desktop-qa:
    name: macOS WebKit desktop Safari-engine QA (no auth)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated WebKit test driver
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
          npx playwright install webkit
      - name: Run native macOS WebKit public-only desktop regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mmhvault-safari-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 2
          node landing-assets/landing-webkit-check.cjs
