name: Transaction Onboarding V1 — independent QA (NO DEPLOY)

on:
  pull_request:
    paths:
      - 'app.html'
      - 'js/mmhvault-transaction-onboarding-*'
      - 'css/mmhvault-transaction-onboarding-v1.css'
      - 'tests/transaction-onboarding-v1-*'
      - '.github/workflows/transaction-onboarding-v1-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    name: Progress, isolation, ledger safety
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check onboarding source
        run: |
          node --check js/mmhvault-transaction-onboarding-state-v1.mjs
          node --check js/mmhvault-transaction-onboarding-live-v1.mjs
          node --check tests/transaction-onboarding-v1-browser-check.cjs
      - name: Pure state regressions
        run: node --test tests/transaction-onboarding-v1-state.test.mjs
      - name: Verify no database or financial mutation
        run: node tests/transaction-onboarding-v1-source-contract.cjs

  chrome:
    runs-on: ubuntu-latest
    name: Chrome real UI, EN/ZH/MY, owner isolation
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned browser driver
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
      - name: Browser-only synthetic member test
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 >/tmp/mmh-onboard-chrome.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 2
          node tests/transaction-onboarding-v1-browser-check.cjs

  webkit:
    runs-on: ubuntu-latest
    name: WebKit mobile guided clicks and no-finance writes
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned WebKit driver
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.56.1
          npx playwright-core install --with-deps webkit
      - name: Mobile synthetic member test
        env:
          MMH_BROWSER_ENGINE: webkit
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 >/tmp/mmh-onboard-webkit.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          sleep 2
          node tests/transaction-onboarding-v1-browser-check.cjs
