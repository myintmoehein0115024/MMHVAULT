name: N10-A7.41 Candidate Safety Checks (Read-Only)
on:
  push:
    branches:
      - n10-a7-40-three-login-candidate

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate only
        uses: actions/checkout@v4
      - name: Install Node for offline tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check candidate JavaScript syntax
        run: |
          node --check js/mmhvault-n10-a7-40-username.js
          node --check js/mmhvault-n10-a7-41-bind.js
          node --check tests/n10-a7-40-auth-candidate-static.cjs
          node --check tests/n10-a7-40-locked-ui-smoke.cjs
          node --check tests/n10-a7-41-username-handoff-mock.cjs
          node --check tests/n10-a7-41-username-bind-mock.cjs
          node --check tests/n10-a7-42-edge-security-vm.cjs
          node --check tests/n10-a7-43-release-no-go-guard.cjs
          node --check tests/n10-a7-46-auth-redirect-contract.cjs
          node --check tests/n10-a7-49-secret-readiness-vm.cjs
          node --check tests/n10-a7-50-admin-health-vm.cjs
          node --check tests/n10-a7-52-two-uid-edge-e2e-vm.cjs
          node --check tests/n10-a7-52-rollback-and-operator-tool.cjs
      - name: Verify unchanged app, closed gates, auth paths, and RLS review constraints
        run: node tests/n10-a7-40-auth-candidate-static.cjs
      - name: Verify locked username UI without network calls
        run: node tests/n10-a7-40-locked-ui-smoke.cjs
      - name: Verify login UID handoff and rejection paths using mocks
        run: node tests/n10-a7-41-username-handoff-mock.cjs
      - name: Verify username binding paths using mocks
        run: node tests/n10-a7-41-username-bind-mock.cjs
      - name: N10-A7.42 mock Edge security and single-use captcha controls
        run: node tests/n10-a7-42-edge-security-vm.cjs
      - name: N10-A7.43 release guard - verify CLOSED, never deploy
        run: node tests/n10-a7-43-release-no-go-guard.cjs
      - name: N10-A7.46 validate real login callback URL routing and UID verification
        run: node tests/n10-a7-46-auth-redirect-contract.cjs
      - name: N10-A7.49 local-only secret-readiness and multi-gate fail-closed verification
        run: node tests/n10-a7-49-secret-readiness-vm.cjs
      - name: N10-A7.50 admin-only boolean health and legacy login lock regression
        run: node tests/n10-a7-50-admin-health-vm.cjs
      - name: N10-A7.52 exact production v4 offline two-account bind, login and rollback safety
        run: node tests/n10-a7-52-two-uid-edge-e2e-vm.cjs
      - name: N10-A7.52 closed rollback snapshot and local operator checklist contract
        run: node tests/n10-a7-52-rollback-and-operator-tool.cjs

  postgres-contracts:
    name: Disposable PostgreSQL 17 schema, RLS and concurrency contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_test_password
          POSTGRES_DB: mmhvault_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mmhvault_ci_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_only_test_password
      PGDATABASE: mmhvault_ci_only
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
      - name: Ensure PostgreSQL client is installed
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Test real SQL unique constraints, privileges, and concurrent throttle on disposable database
        run: bash tests/n10-a7-44-postgres-contract.sh
