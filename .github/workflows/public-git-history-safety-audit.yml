name: Public Git history security audit (manual, read-only, no deployment)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-public-history-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout full Public Git history without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test secret-safe scanner
        run: python3 .github/audits/audit-public-git-history.py --self-test
      - name: Scan reachable Git history (summary only, never print secrets)
        run: python3 .github/audits/audit-public-git-history.py --output public-git-safety-summary.json
      - name: Archive aggregate report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-git-history-safety-summary
          path: public-git-safety-summary.json
          retention-days: 7
          if-no-files-found: ignore
