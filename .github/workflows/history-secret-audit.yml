name: MMHVAULT read-only Git history secret audit (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'security/history-secret-audit.cjs'
      - '.github/workflows/history-secret-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Scan reachable historical Git blobs, never print credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch all branch and tag refs for historical coverage
        run: |
          git fetch --no-recurse-submodules --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Check audit script syntax
        run: node --check security/history-secret-audit.cjs
      - name: Scan all fetched reachable Git blobs (read-only)
        run: node security/history-secret-audit.cjs
