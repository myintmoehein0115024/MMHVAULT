name: N10 recovery security - offline checks
on:
  push:
    branches:
      - 'feature/n10-fixed-recovery-key-modal-20261031'
  pull_request:
    paths:
      - 'security/n10-fixed-recovery-vault-candidate/**'
      - 'docs/sql/n10_fixed_recovery_*.sql'
      - '.github/workflows/n10-recovery-security-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-security:
    name: Offline recovery candidate checks (NO deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch (read only)
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MFA assurance matrix (synthetic only)
        run: node security/n10-fixed-recovery-vault-candidate/test-mfa-assurance.mjs
      - name: Auth session integrity matrix (synthetic only)
        run: node security/n10-fixed-recovery-vault-candidate/test-session-guard.mjs
      - name: Backend and SQL static security contracts
        run: node security/n10-fixed-recovery-vault-candidate/test-candidate-contracts.mjs
      - name: UI secret auto-hide and stale-response guards (static only)
        run: node security/n10-fixed-recovery-vault-candidate/test-ui-secret-guards.mjs
      - name: Install Deno for dependency and TypeScript checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check undeployed Vault Edge candidate (NO execution)
        run: deno check security/n10-fixed-recovery-vault-candidate/index.ts security/n10-fixed-recovery-vault-candidate/username-signup-integration-NOT_DEPLOYED.ts security/n10-fixed-recovery-vault-candidate/qa-staging-recovery-NOT_DEPLOYED.ts security/n10-fixed-recovery-vault-candidate/qa-joint-mfa-vault-STAGING-NOT_DEPLOYED.ts security/n10-fixed-recovery-vault-candidate/qa-retired-tombstone-STAGING.ts
# Deliberately no Supabase or GitHub deployment, SQL writes, secrets, or live users.
