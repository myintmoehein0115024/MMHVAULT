name: Finance data-link regression
on:
  push:
    branches:
      - fix/data-integrity-accounts-analyze-20261101
  pull_request:
    paths:
      - app.html
      - tests/data-integrity-v1.test.mjs
      - .github/workflows/data-integrity-check.yml
permissions:
  contents: read
jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run finance data-link regression tests
        run: node --test tests/data-integrity-v1.test.mjs
