<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MMHVAULT · 管理后台</title><style>

ize:12px;text-align:right;color:#9bb1c6}.activity b{display:block;margin-bottom:5px;color:#a9d9c3}.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}#message{font-size:13px;line-height:1.6;margin:16px 0;color:#b5d5eb;overflow-wrap:anywhere}#gate{max-width:540px;margin:32px auto}#gate p{line-height:1.7;color:#9bb1c6}footer{color:#9bb1c6;font-size:12px;line-height:1.7;margin-top:22px}[hidden]{display:none!important}@media(max-width:700px){main,header{padding:16px}.metrics{grid-template-columns:1fr 1fr}.metric{padding:15px}.metric strong{font-size:28px}header .brand small{display:none}.user{align-items:flex-start;flex-direction:column}.activity{max-width:100%;text-align:left}.panel{padding:16px}h1{font-size:23px}}
</style></head><body><header><div class="brand"><img data-mmh-brand-v11="true" alt="MMHVAULT" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="><div><b>MMHVAULT</b><br><small>管理员工作台</small></div></div><a href="app.html" class="button">返回 APP</a></header><main><div id="message" role="status" aria-live="polite">正在验证登录与管理员权限…</div><section id="gate" class="panel"><h1>管理后台</h1><p id="gateText">请使用管理员 Google 账号登录。权限由服务器核验。</p><div class="actions"><button id="google" class="primary">使用 Google 登录</button><button id="switch" hidden>退出当前账号</button><button id="retry">重新检查</button></div></section><section id="dashboard" hidden><div class="toolbar"><div><h1>管理员工作台</h1><div class="sub">用户使用状态 · 不包含任何财务记录</div></div><div class="actions"><button id="refresh">刷新统计</button><button id="logout">退出后台</button></div></div><nav class="admin-tabs" aria-label="后台页面"><button id="adminUsageTab" aria-pressed="true">使用概览</button><button id="adminFeedbackTab" aria-pressed="false">反馈中心</button></nav><div id="adminUsageView"><div class="metrics"><div class="metric"><small>注册账号总数</small><strong id="registered">—</strong></div><div class="metric"><small>今日活跃用户</small><strong id="today">—</strong></div><div class="metric"><small>本月活跃用户</small><strong id="month">—</strong></div><div class="metric"><small>最近 5 分钟活跃</small><strong id="recent">—</strong></div></div><section class="panel"><div class="toolbar"><h2>用户使用状态</h2><small id="updated"></small></div><form class="search" id="searchForm"><input type="search" id="search" aria-label="搜索邮箱或用户 ID" placeholder="搜索邮箱或用户 ID" maxlength="200"><button type="submit">搜索</button></form><div id="users" class="users"></div><div class="pagination"><button id="prev">上一页</button><small id="page"></small><button id="next">下一页</button></div></section><footer>活跃统计从新版 APP 上线后开始记录，按北京时间计算。最近 5 分钟活跃表示最近收到使用记录，不代表实时在线。页面在前台时每 60 秒刷新统计。<br>通知中心将在后续阶段加入。</footer></div><section id="adminFeedbackView" hidden><div class="feedback-metrics"><div><small>待处理</small><strong id="afNew">—</strong></div><div><small>处理中</small><strong id="afWorking">—</strong></div><div><small>已解决</small><strong id="afResolved">—</strong></div></div><section class="panel"><div class="toolbar"><div><h2>反馈收件箱</h2><small>查看用户问题与建议，更新处理状态并回复</small></div><button id="afRefresh">刷新反馈</button></div><div class="af-filter"><label for="afFilter">处理状态</label><select id="afFilter"><option value="">全部反馈</option><option value="new">待处理</option><option value="working">处理中</option><option value="resolved">已解决</option></select></div><p id="afMessage" role="status" aria-live="polite"></p><div id="afList"></div><div class="pagination"><button id="afPrev">上一页</button><small id="afPage"></small><button id="afNext">下一页</button></div></section></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);if(!window.supabase){$('message').textContent='登录组件加载失败，请检查网络后刷新。';$('google').disabled=true;return}const client=supabase.createClient('https://vrypucmyrztxgiqhjspd.supabase.co','sb_publishable_H38v4XbO0ARnSJToD42wGg_27-SZ3Ao');window.mmhAdminClient=client;let generation=0,timer=null,offset=0,search='',allowed=false,busy=false,total=0;
const msg=text=>$('message').textContent=text;const date=x=>x?new Date(x).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'尚未记录';
function clear(){clearTimeout(timer);timer=null;allowed=false;busy=false;$('dashboard').hidden=true;$('gate').hidden=false;$('users').replaceChildren();for(const id of ['registered','today','month','recent'])$(id).textContent='—'}
function schedule(){clearTimeout(timer);if(allowed&&!document.hidden)timer=setTimeout(load,60000)}
async function load(){if(!allowed||busy||document.hidden)return;busy=true;const g=generation;$('refresh').disabled=true;try{const {data,error}=await client.rpc('mmh_admin_overview',{p_search:search,p_offset:offset});if(g!==generation)return;if(error)throw error;if(!data||!Array.isArray(data.users))throw Error('Invalid response');for(const [id,key] of [['registered','registered'],['today','active_today'],['month','active_month'],['recent','recent_active']])$(id).textContent=Number(data[key]).toLocaleString('zh-CN');total=data.total_matches;$('users').replaceChildren();for(const u of data.users){const row=document.createElement('div');row.className='user';const identity=document.createElement('div');identity.className='identity';const b=document.createElement('b');b.textContent=u.email||u.id;const small=document.createElement('small');small.textContent='注册：'+date(u.created_at);identity.append(b,small);const activity=document.createElement('div');activity.className='activity';const status=document.createElement('b');status.textContent=u.last_seen&&Date.now()-new Date(u.last_seen).getTime()<300000?'最近活跃':u.last_seen?'已有使用记录':'尚无使用记录';const last=document.createElement('span');last.textContent='最近使用：'+date(u.last_seen);activity.append(status,last);row.append(identity,activity);$('users').append(row)}if(!data.users.length)$('users').textContent='没有匹配的用户。';$('prev').disabled=offset===0;$('next').disabled=offset+50>=total;$('page').textContent=total?`${offset+1}–${Math.min(offset+50,total)} / ${total}`:'0 / 0';$('updated').textContent='更新：'+date(data.updated_at)+' · 北京时间';msg('管理员权限已验证。')}catch(e){if(g!==generation)return;if(e.code==='42501'){clear();msg('管理员权限已撤销或登录已过期，请重新检查。')}else{msg('统计暂时无法刷新，当前显示可能已过期。请检查网络后重试。')}}finally{if(g===generation){busy=false;$('refresh').disabled=false;schedule()}}}
async function boot(){const g=++generation;clear();msg('正在验证登录与管理员权限…');try{const {data,error}=await client.auth.getUser();if(g!==generation)return;if(error&&!data?.user)throw error;const user=data?.user;if(!user){msg('请登录管理员 Google 账号。');$('switch').hidden=true;$('google').hidden=false;return}$('switch').hidden=false;$('google').hidden=true;const result=await client.rpc('mmh_is_admin');if(g!==generation)return;if(result.error)throw result.error;if(!result.data){$('gateText').textContent='当前账号没有管理员权限。请退出后使用指定管理员 Google 账号登录。';msg('访问受限，未读取用户统计。');return}allowed=true;offset=0;$('gate').hidden=true;$('dashboard').hidden=false;await load()}catch(e){if(g===generation){$('google').hidden=false;msg(e.name==='AuthSessionMissingError'?'请使用管理员 Google 账号登录。':'暂时无法核验权限，请检查网络后重试。')}}}
$('google').onclick=async()=>{const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:new URL('admin.html',location.href).href,queryParams:{prompt:'select_account'}}});if(error)msg('Google 登录失败：'+error.message)};
async function logout(){++generation;clear();const {error}=await client.auth.signOut();msg(error?'退出失败，请重试。':'已退出登录。');$('google').hidden=false;$('switch').hidden= !error}
$('logout').onclick=logout;$('switch').onclick=logout;$('retry').onclick=boot;$('refresh').onclick=load;$('searchForm').onsubmit=e=>{e.preventDefault();if(busy)return;search=$('search').value.trim();offset=0;load()};$('prev').onclick=()=>{if(busy)return;offset=Math.max(0,offset-50);load()};$('next').onclick=()=>{if(busy)return;offset+=50;load()};document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)allowed?load():boot()});window.addEventListener('pagehide',()=>clearTimeout(timer));client.auth.onAuthStateChange(()=>{++generation;clear();setTimeout(boot,0)});boot();
})();

<script id="mmhvault-admin-notices-v15-script">
(()=>{'use strict';const client=window.mmhAdminClient,$=id=>document.getElementById(id);if(!client)return;let noticeView,noticeTab;
function init(){const nav=document.querySelector('.admin-tabs'),dash=$('dashboard');if(!nav||!dash||$('adminNoticeTab'))return;noticeTab=document.createElement('button');noticeTab.id='adminNoticeTab';noticeTab.textContent='通知与公告';noticeTab.setAttribute('aria-pressed','false');nav.append(noticeTab);noticeView=document.createElement('section');noticeView.id='adminNoticeView';noticeView.hidden=true;noticeView.innerHTML='<section class="panel"><div class="toolbar"><div><h2>发送通知</h2><small>可发送给指定用户，或发布给全部用户</small></div></div><form id="anFormV15" class="notice-compose-v15"><label>发送对象<select id="anAudienceV15"><option value="all">全体用户 · 公告</option><option value="personal">指定用户 · 个人通知</option></select></label><label id="anEmailLabelV15" hidden>用户邮箱<input id="anEmailV15" type="email" maxlength="320" placeholder="user@example.com"></label><label>标题<input id="anTitleV15" maxlength="120" required></label><label>内容<textarea id="anBodyV15" maxlength="4000" required></textarea></label><button id="anSendV15" type="submit">发送</button><p id="anMsgV15" class="af-result" role="status"></p></form></section><section class="panel" style="margin-top:16px"><div class="toolbar"><h2>已发送</h2><button id="anRefreshV15" type="button">刷新</button></div><div id="anListV15"></div></section>';dash.append(noticeView);noticeTab.onclick=()=>show();$('anAudienceV15').onchange=()=>{$('anEmailLabelV15').hidden=$('anAudienceV15').value!=='personal'};$('anRefreshV15').onclick=load;$('anFormV15').onsubmit=send;document.querySelectorAll('#adminUsageTab,#adminFeedbackTab').forEach(b=>b.addEventListener('click',()=>{noticeView.hidden=true;noticeTab.setAttribute('aria-pressed','false')}));decorateFeedback()}
function show(){$('adminUsageView').hidden=true;$('adminFeedbackView').hidden=true;noticeView.hidden=false;document.querySelectorAll('.admin-tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b===noticeTab)));load()}
async function send(e){e.preventDefault();const btn=$('anSendV15'),personal=$('anAudienceV15').value==='personal',email=personal?$('anEmailV15').value.trim():'',title=$('anTitleV15').value.trim(),body=$('anBodyV15').value.trim();if(personal&&!email){$('anMsgV15').textContent='请输入用户邮箱。';return}btn.disabled=true;$('anMsgV15').textContent='正在发送…';try{const {error}=await client.rpc('mmh_feedback_extras',{p_action:'publish',p_data:{email,title,body}});if(error)throw error;$('anMsgV15').textContent=personal?'个人通知已发送。':'全体公告已发布。';$('anFormV15').reset();$('anEmailLabelV15').hidden=true;load()}catch(err){$('anMsgV15').textContent=String(err.message||'发送失败').includes('Recipient not found')?'找不到这个用户邮箱。':'发送失败，请重试。'}finally{btn.disabled=false}}
async function load(){const box=$('anListV15');box.textContent='正在加载…';const {data,error}=await client.rpc('mmh_feedback_extras',{p_action:'admin_list',p_data:{offset:0}});if(error){box.textContent='加载失败。';return}box.replaceChildren();for(const row of (data||[])){const c=document.createElement('article');c.className='an-item-v15';const h=document.createElement('h3');h.textContent=row.title;const meta=document.createElement('small');meta.textContent=(row.audience==='all'?'全体公告':'个人通知 · '+(row.email||'用户'))+' · '+new Date(row.created_at).toLocaleString('zh-CN')+(row.published?'':' · 已撤回');const p=document.createElement('p');p.textContent=row.body;c.append(h,meta,p);if(row.published){const b=document.createElement('button');b.type='button';b.textContent='撤回';b.onclick=async()=>{if(!confirm('确定撤回这条通知吗？'))return;const {error}=await client.rpc('mmh_feedback_extras',{p_action:'withdraw',p_data:{id:row.id}});if(!error)load()};c.append(b)}box.append(c)}if(!(data||[]).length)box.textContent='暂无已发送通知。'}
function decorateFeedback(){const list=$('afList');if(!list)return;new MutationObserver(async()=>{const {data,error}=await client.rpc('mmh_list_feedback',{p_admin:true,p_status:$('afFilter')?.value||'',p_offset:0});if(error)return;const cards=[...list.querySelectorAll('.af-item')];for(let i=0;i<Math.min(cards.length,data.items.length);i++){const row=data.items[i],card=cards[i];if(row.rating&&!card.querySelector('.af-stars-v15')){const x=document.createElement('div');x.className='af-stars-v15';x.textContent='评分 · '+'★'.repeat(row.rating)+'☆'.repeat(5-row.rating);card.querySelector('.af-body')?.after(x)}if(row.photos?.length&&!card.querySelector('.fb-admin-photos-v15')){const box=document.createElement('div');box.className='fb-admin-photos-v15';for(const path of row.photos){const {data:signed}=await client.storage.from('mmh-feedback').createSignedUrl(path,600);if(signed?.signedUrl){const a=document.createElement('a');a.href=signed.signedUrl;a.target='_blank';a.rel='noopener';const img=document.createElement('img');img.src=signed.signedUrl;a.append(img);box.append(a)}}card.querySelector('.af-body')?.after(box)}}}).observe(list,{childList:true})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(init,0));else setTimeout(init,0);
})();
</script>

<script id="mmhvault-admin-feedback-v14">
(()=>{'use strict';const client=window.mmhAdminClient;if(!client)return;const $=id=>document.getElementById(id);let offset=0,total=0,epoch=0,loading=false;const state=s=>({new:'待处理',working:'处理中',resolved:'已解决'})[s],date=x=>new Date(x).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});function clear(){++epoch;loading=false;offset=0;total=0;$('afRefresh').disabled=false;$('afFilter').disabled=false;$('afList').replaceChildren();$('afMessage').textContent='';for(const id of ['afNew','afWorking','afResolved'])$(id).textContent='—'}
function tabs(feedback){$('adminUsageView').hidden=feedback;$('adminFeedbackView').hidden=!feedback;$('adminUsageTab').setAttribute('aria-pressed',String(!feedback));$('adminFeedbackTab').setAttribute('aria-pressed',String(feedback));if(feedback)load()}
function item(row){const d=document.createElement('details');d.className='af-item';const summary=document.createElement('summary'),title=document.createElement('b'),badge=document.createElement('span');title.textContent=row.title;badge.className='af-badge';badge.dataset.status=row.status;badge.textContent=state(row.status);summary.append(title,badge);const meta=document.createElement('p');meta.className='af-meta';meta.textContent=(row.email||'用户')+' · '+({bug:'问题',idea:'建议',other:'其他'})[row.category]+' · '+date(row.created_at);const body=document.createElement('p');body.className='af-body';body.textContent=row.body;const editor=document.createElement('form');editor.className='af-editor';const label=document.createElement('label');label.textContent='处理状态';const select=document.createElement('select');select.setAttribute('aria-label','处理状态');for(const value of ['new','working','resolved']){const o=document.createElement('option');o.value=value;o.textContent=state(value);select.append(o)}select.value=row.status;label.append(select);const replyLabel=document.createElement('label');replyLabel.textContent='管理员回复';const text=document.createElement('textarea');text.maxLength=4000;text.value=row.reply||'';text.placeholder='填写回复，用户可在 APP 的反馈中心查看';replyLabel.append(text);const button=document.createElement('button');button.type='submit';button.textContent='保存状态与回复';const result=document.createElement('span');result.className='af-result';result.setAttribute('role','status');editor.append(label,replyLabel,button,result);editor.onsubmit=async e=>{e.preventDefault();if(button.disabled)return;const g=epoch;button.disabled=true;result.textContent='正在保存…';try{const {error}=await client.rpc('mmh_update_feedback',{p_id:row.id,p_status:select.value,p_reply:text.value.trim(),p_revision:row.revision});if(g!==epoch)return;if(error)throw error;row.revision++;row.status=select.value;row.reply=text.value.trim();badge.dataset.status=row.status;badge.textContent=state(row.status);result.textContent='已保存，用户可在反馈中心查看。';const {data,error:err}=await client.rpc('mmh_list_feedback',{p_admin:true,p_status:$('afFilter').value,p_offset:offset});if(g===epoch&&!err)counts(data.counts)}catch(error){if(g===epoch)result.textContent=error.code==='40001'?'这条反馈已更新，请保留回复内容并刷新后重试。':'保存失败，请重试。'}finally{if(g===epoch)button.disabled=false}};d.append(summary,meta,body,editor);return d}
function counts(c){$('afNew').textContent=c.new;$('afWorking').textContent=c.working;$('afResolved').textContent=c.resolved}
async function load(){if(loading||$('dashboard').hidden||$('adminFeedbackView').hidden)return;loading=true;const g=epoch;$('afRefresh').disabled=true;$('afFilter').disabled=true;$('afMessage').textContent='正在加载反馈…';try{const {data,error}=await client.rpc('mmh_list_feedback',{p_admin:true,p_status:$('afFilter').value,p_offset:offset});if(g!==epoch)return;if(error)throw error;counts(data.counts);total=data.total;$('afList').replaceChildren(...data.items.map(item));if(!data.items.length)$('afList').textContent='暂无匹配的反馈。';$('afPrev').disabled=offset===0;$('afNext').disabled=offset+20>=total;$('afPage').textContent=total?`${offset+1}–${Math.min(offset+20,total)} / ${total}`:'0 / 0';$('afMessage').textContent='共 '+total+' 条反馈。'}catch(_){if(g===epoch)$('afMessage').textContent='反馈加载失败或权限已过期，请重试。'}finally{if(g===epoch){loading=false;$('afRefresh').disabled=false;$('afFilter').disabled=false}}}
$('adminUsageTab').onclick=()=>tabs(false);$('adminFeedbackTab').onclick=()=>tabs(true);$('afRefresh').onclick=load;$('afFilter').onchange=()=>{if(loading)return;offset=0;load()};$('afPrev').onclick=()=>{if(loading)return;offset=Math.max(0,offset-20);load()};$('afNext').onclick=()=>{if(loading)return;offset+=20;load()};new MutationObserver(()=>{if($('dashboard').hidden){clear();tabs(false)}else if(!$('adminFeedbackView').hidden)load()}).observe($('dashboard'),{attributes:true,attributeFilter:['hidden']});
})();
</script>
