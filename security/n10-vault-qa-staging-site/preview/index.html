<div class="shell">

 <div class="notice" role="status"><span class="dot"></span><div><strong data-t="noticeTitle"></strong><div data-t="noticeBody"></div></div></div>
 <div class="headline"><div class="eyebrow">ACCOUNT SECURITY / N10</div><h1 data-t="pageTitle"></h1><p data-t="pageSub"></p></div>
 <div class="grid">
  <section class="glass large" aria-labelledby="cardTitle">
   <div class="card-hd"><div class="icon-frame" aria-hidden="true">✧</div><div><h2 id="cardTitle" data-t="keyTitle"></h2><small data-t="keySubtitle"></small></div></div>
   <div class="split"></div>
   <div class="status-row"><div><div class="label" data-t="keyStatusTitle"></div><div class="subtext" data-t="keyStatusSub"></div></div><div class="tag" data-t="keyStatusPill"></div></div>
   <div class="key-preview" aria-hidden="true"><span data-t="maskedTitle"></span><span class="masked">•••• ••••</span></div>
   <button id="openDialog" type="button" class="gold-btn"><span aria-hidden="true">✦</span><span data-t="open"></span></button>
   <div class="under-btn" data-t="openNote"></div>
  </section>
  <div class="sidecol">
   <section class="glass small-card"><div class="shield" aria-hidden="true">♢</div><div class="small-eyebrow" data-t="protection"></div><h3 data-t="mfaTitle"></h3><p data-t="mfaDescription"></p></section>
   <section class="glass small-card"><div class="small-eyebrow" data-t="demoProfile"></div><h3 data-t="profileTitle"></h3><div class="account-rows"><div class="account-row"><span data-t="modeTitle"></span><b data-t="modeValue"></b></div><div class="account-row"><span data-t="backupTitle"></span><b data-t="backupValue"></b></div></div></section>
  </div>
 </div>
 <div class="glass below"><div class="below-icon" aria-hidden="true">◎</div><div><strong data-t="belowTitle"></strong><p data-t="belowDescription"></p></div></div>
</main>
</div>
<div id="modal" class="modal" hidden role="presentation">
 <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogDesc">
  <div class="modal-top"><div class="modal-icon" aria-hidden="true">✧</div><button type="button" id="close" class="close-btn" aria-label="Close">×</button></div>
  <h2 id="dialogTitle" data-t="modalTitle"></h2>
  <p id="dialogDesc" class="desc" data-t="modalDesc"></p>
  <div id="preReveal">
    <div class="info-line"><span class="demo-tag" data-t="demoStatus"></span><div data-t="modalInfo"></div></div>
    <button id="reveal" type="button" class="gold-btn"><span data-t="simulate"></span></button>
    <div class="warn" data-t="noPassword"></div>
  </div>
  <div id="revealed" hidden>
    <div class="info-line"><span class="demo-tag" data-t="fakeData"></span><div data-t="revealedInfo"></div></div>
    <div class="word-grid" id="words" aria-label="Example recovery words"></div>
    <div id="countdown" class="countdown" role="status" aria-live="off"></div>
    <button id="hide" type="button" class="secondary" data-t="hide"></button>
    <div class="warn" data-t="showWarning"></div>
  </div>
 </section>
</div>
